# Listing 26.3 — docker-compose.yml: the local Murmur stack (development only).
# Two networks mirror the production trust boundaries of Fig 26.1: "edge" is what devices reach;
# "internal" carries mTLS-only service traffic and is not published to the host.
name: murmur-dev

x-service: &service
  restart: unless-stopped
  read_only: true                       # containers can't modify their own image
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &env
    MURMUR_ENV: dev
    SSLKEYLOGFILE: ""                   # key logging is OFF unless you opt in per run (§26.6)

services:
  pki-init:                             # Ch 4 tool: issues root + intermediates + 30-day leaves once
    image: golang:1.24
    working_dir: /src/tools/murmurpki
    command: ["go", "run", ".", "issue", "-out", "/pki", "-dev-edge-domain", "murmur.test"]
    volumes: ["../tools:/src/tools:ro", "pki:/pki"]
    restart: "no"

  postgres:
    <<: *service
    image: postgres:17
    read_only: false
    environment: { POSTGRES_PASSWORD_FILE: /run/secrets/pg_password, POSTGRES_DB: murmur }
    secrets: [pg_password]
    networks: [internal]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  murmur-auth:                          # OIDC/OAuth AS: PKCE, DPoP, passkeys, step-up (Ch 11–15)
    <<: *service
    build: { context: ../server, args: { CMD: murmur-auth } }
    depends_on: { pki-init: { condition: service_completed_successfully }, postgres: { condition: service_started } }
    environment: { <<: *env, TLS_CERT: /pki/edge/auth.murmur.test.pem, ISSUER: "https://auth.murmur.test" }
    volumes: ["pki:/pki:ro"]
    networks: { edge: { aliases: [auth.murmur.test] }, internal: { aliases: [auth.murmur.internal] } }
    ports: ["8443:443"]

  murmur-api:                           # resource server: keys, device lists, groups, KT (Ch 18–24)
    <<: *service
    build: { context: ../server, args: { CMD: murmur-api } }
    depends_on: [murmur-auth, murmur-relay, murmur-push]
    environment: { <<: *env, TLS_CERT: /pki/edge/api.murmur.test.pem, MTLS_CERT: /pki/services/murmur-api.pem }
    volumes: ["pki:/pki:ro"]
    networks: { edge: { aliases: [api.murmur.test] }, internal: { aliases: [api.murmur.internal] } }
    ports: ["8444:443"]

  murmur-relay:                         # envelope store-and-forward, sealed sender, MLS DS (Ch 21, 23)
    <<: *service
    build: { context: ../server, args: { CMD: murmur-relay } }
    environment: { <<: *env, MTLS_CERT: /pki/services/murmur-relay.pem, ALLOW_CALLERS: "spiffe://murmur.internal/service/murmur-api" }
    volumes: ["pki:/pki:ro"]
    networks: { internal: { aliases: [relay.murmur.internal] } }   # NOT on edge in this listing; see §26.2

  murmur-push:                          # content-free wakeups to FCM/APNs (Ch 21 §21.4)
    <<: *service
    build: { context: ../server, args: { CMD: murmur-push } }
    environment: { <<: *env, MTLS_CERT: /pki/services/murmur-push.pem, PUSH_MODE: log-only }
    volumes: ["pki:/pki:ro"]
    networks: { internal: { aliases: [push.murmur.internal] } }

networks:
  edge: {}
  internal: { internal: true }          # no route to the host or the internet

volumes: { pki: {}, pgdata: {} }
secrets: { pg_password: { file: ./secrets/pg_password.txt } }
