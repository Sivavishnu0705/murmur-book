# Cargo.toml for murmur-core as of Chapter 26 (Listing 26.2: the UniFFI interface; method
# bodies are unimplemented!() until Chapters 27–30). UniFFI 0.29.
[package]
name = "murmur-core"
version = "0.26.0"
edition = "2021"
publish = false

[lib]
name = "murmur_core"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "=0.29.5", features = ["cli"] }
thiserror = "2"
