# Cargo.toml for the Chapter 17 pairing core (not printed; versions from Chapter 17's
# "About the listings": snow 0.10, UniFFI 0.29.5).
[package]
name = "murmur-pairing"
version = "0.17.0"
edition = "2021"
publish = false

[lib]
name = "murmur_pairing"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
snow = "0.10"
uniffi = { version = "=0.29.5", features = ["cli"] }
thiserror = "2"
sha2 = "0.10"
hkdf = "0.12"
