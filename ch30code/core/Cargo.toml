# Cargo.toml for murmur-core as of Chapter 30 (not printed in the book; versions from
# Chapter 30's "About the listings": OpenMLS 0.7.4, openmls_rust_crypto 0.4.4, UniFFI 0.29.5).
# Build and generate bindings as Appendix E.6 shows:
#   cargo build --release
#   cargo run --bin uniffi-bindgen -- generate --library target/release/libmurmur_groups.so \
#       --language python --out-dir py
[package]
name = "murmur-core"
version = "0.30.0"
edition = "2021"
publish = false

[lib]
name = "murmur_groups"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "perf"            # Listing 30.6: cargo run --release --bin perf
path = "src/perf.rs"

[dependencies]
openmls = "=0.7.4"
openmls_rust_crypto = { version = "=0.4.4", features = ["test-utils"] }
openmls_basic_credential = "0.4"
openmls_traits = "0.4"
uniffi = { version = "=0.29.5", features = ["cli"] }
thiserror = "2"
curve25519-dalek = "4"
ed25519-dalek = "2"

[profile.release]
lto = true
